[project]
name = "waterbrush"
version = "0.0.1"
description = "Physics-based watercolor simulator (Curtis et al. 1997 three-layer model, Kubelka-Munk optics) with an easel API for an AI painter"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
fast = ["numba>=0.58"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["waterbrush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
